name: Functional test

on:
  pull_request:
    branches: [main]

jobs:
  functional-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: testpassword
      DB_NAME: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Start the app
        run: |
          python app.py &
          for i in $(seq 1 15); do
            curl -s http://localhost:5000/ > /dev/null && break
            sleep 1
          done

      - name: Check database connection status
        run: |
          curl -s http://localhost:5000/ | tee response.txt
          grep -F "Database Connection Status: Connected" response.txt